<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR con modelo GLB</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #aviso {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 10; padding: 10px; border-radius: 8px;
      background: #153451; color: white;
      font: 16px Arial; text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="aviso">v3 - Cargando...</div>

  <a-scene id="escena"
    mindar-image="imageTargetSrc: ./target.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="60000">
      <a-asset-item id="miModelo" src="./modelo.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="objetivo" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="modelo"
        src="#miModelo"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const aviso = document.getElementById("aviso");
    const escena = document.getElementById("escena");
    const objetivo = document.getElementById("objetivo");
    const modelo = document.getElementById("modelo");

    // Tamaño final del modelo en el target (1 = ancho del target)
    const TAMANO_DESEADO = 0.8;

    modelo.addEventListener("model-loaded", () => {
      const malla = modelo.getObject3D("mesh");
      malla.updateMatrixWorld(true);

      const caja = new THREE.Box3().setFromObject(malla);
      const size = new THREE.Vector3();
      const centro = new THREE.Vector3();
      caja.getSize(size);
      caja.getCenter(centro);

      const mayor = Math.max(size.x, size.y, size.z);
      const escala = TAMANO_DESEADO / mayor;

      // Centrar en x/z y apoyar la base sobre el target
      malla.position.x = -centro.x;
      malla.position.y = -caja.min.y;
      malla.position.z = -centro.z;

      modelo.setAttribute("scale", escala + " " + escala + " " + escala);
      modelo.setAttribute("rotation", "90 0 0");

      aviso.textContent = "v3 - Modelo listo (escala " + escala.toFixed(1) + "). Apunta al target";
    });

    modelo.addEventListener("model-error", () => aviso.textContent = "v3 - Error al cargar modelo.glb");
    escena.addEventListener("arError", () => aviso.textContent = "v3 - Error: cámara o target.mind no cargó");
    objetivo.addEventListener("targetFound", () => aviso.textContent = "v3 - Target detectado");
    objetivo.addEventListener("targetLost", () => aviso.textContent = "v3 - Target perdido");
  </script>
</body>
</html>
