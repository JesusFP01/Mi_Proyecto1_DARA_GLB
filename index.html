<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR con modelo GLB</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; }
    .barra {
      position: fixed; left: 12px; right: 12px; z-index: 10;
      padding: 8px; border-radius: 8px; color: white;
      font: 15px Arial; text-align: center; pointer-events: none;
    }
    #aviso { top: 12px; background: #153451; }
    #debug { top: 60px; background: rgba(0,0,0,0.6); font-size: 13px; }
  </style>
</head>
<body>
  <div id="aviso" class="barra">v6 - Cargando...</div>
  <div id="debug" class="barra">modelo: esperando</div>

  <a-scene id="escena"
    mindar-image="imageTargetSrc: ./target.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="60000">
      <a-asset-item id="miModelo" src="./modelo.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="objetivo" mindar-image-target="targetIndex: 0">
      <a-entity id="contenedor">
        <a-gltf-model id="modelo" src="#miModelo"></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const aviso = document.getElementById("aviso");
    const debug = document.getElementById("debug");
    const escena = document.getElementById("escena");
    const objetivo = document.getElementById("objetivo");
    const modelo = document.getElementById("modelo");
    const contenedor = document.getElementById("contenedor");

    const TAMANO_DESEADO = 0.8;     // 1 = ancho del target
    const ESCALA_RESPALDO = 18;     // se usa solo si la medición falla
    let ajustado = false;

    window.addEventListener("error", (e) => {
      debug.textContent = "ERROR JS: " + e.message;
    });

    // Mide el modelo usando solo sus transformaciones locales
    // (no depende del target ni de matrices del mundo)
    function medirCaja(raiz) {
      raiz.traverse((n) => n.updateMatrix());
      const caja = new THREE.Box3();
      raiz.traverse((o) => {
        if (o.isMesh && o.geometry) {
          if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
          const bb = o.geometry.boundingBox;
          if (!bb || bb.isEmpty()) return;
          const M = new THREE.Matrix4().copy(o.matrix);
          let p = o.parent;
          while (p && p !== raiz) { M.premultiply(p.matrix); p = p.parent; }
          caja.union(bb.clone().applyMatrix4(M));
        }
      });
      return caja;
    }

    function ajustarModelo() {
      if (ajustado) return;
      const malla = modelo.getObject3D("mesh");
      if (!malla) { debug.textContent = "modelo: aún no carga"; return; }

      let escala = ESCALA_RESPALDO;
      let nota = "respaldo";

      try {
        const caja = medirCaja(malla);
        const size = new THREE.Vector3();
        const centro = new THREE.Vector3();
        caja.getSize(size);
        caja.getCenter(centro);
        const mayor = Math.max(size.x, size.y, size.z);

        if (!caja.isEmpty() && isFinite(mayor) && mayor > 0) {
          escala = TAMANO_DESEADO / mayor;
          // Centrar en x/z y apoyar la base sobre el target
          malla.position.set(-centro.x, -caja.min.y, -centro.z);
          nota = "medido";
        }
      } catch (err) {
        debug.textContent = "ERROR medición: " + err.message;
      }

      modelo.object3D.scale.set(escala, escala, escala);
      modelo.object3D.rotation.set(Math.PI / 2, 0, 0);   // acostado sobre el target

      ajustado = true;
      debug.textContent = "modelo: " + nota + ", escala " + escala.toFixed(1);
    }

    modelo.addEventListener("model-loaded", ajustarModelo);
    modelo.addEventListener("model-error", () => debug.textContent = "ERROR: no cargó modelo.glb");
    if (modelo.getObject3D("mesh")) ajustarModelo();

    escena.addEventListener("arReady", () => { aviso.textContent = "v6 - Cámara lista. Apunta al target"; ajustarModelo(); });
    escena.addEventListener("arError", () => aviso.textContent = "v6 - Error: cámara o target.mind no cargó");
    objetivo.addEventListener("targetFound", () => { aviso.textContent = "v6 - Target detectado"; ajustarModelo(); });
    objetivo.addEventListener("targetLost", () => aviso.textContent = "v6 - Target perdido");

    // ---------- GESTOS TÁCTILES ----------
    const SENS_GIRO = 0.01;
    const SENS_MOVER = 0.003;
    const ESCALA_MIN = 0.3;
    const ESCALA_MAX = 4;

    let ultimoX = 0;
    let distAnterior = 0;
    let centroAnterior = { x: 0, y: 0 };

    const distancia = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const puntoMedio = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });

    window.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        ultimoX = e.touches[0].clientX;
      } else if (e.touches.length === 2) {
        distAnterior = distancia(e.touches);
        centroAnterior = puntoMedio(e.touches);
      }
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      const obj = contenedor.object3D;

      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - ultimoX;
        obj.rotation.z += dx * SENS_GIRO;
        ultimoX = e.touches[0].clientX;

      } else if (e.touches.length === 2) {
        const d = distancia(e.touches);
        if (distAnterior > 0) {
          let nueva = obj.scale.x * (d / distAnterior);
          nueva = Math.min(ESCALA_MAX, Math.max(ESCALA_MIN, nueva));
          obj.scale.set(nueva, nueva, nueva);
        }
        distAnterior = d;

        const c = puntoMedio(e.touches);
        obj.position.x += (c.x - centroAnterior.x) * SENS_MOVER;
        obj.position.y -= (c.y - centroAnterior.y) * SENS_MOVER;
        centroAnterior = c;
      }
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (e.touches.length === 1) ultimoX = e.touches[0].clientX;
      distAnterior = 0;
    });
  </script>
</body>
</html>
